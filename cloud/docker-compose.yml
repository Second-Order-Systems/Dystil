services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: work_insights
      POSTGRES_USER: work_insights
      POSTGRES_PASSWORD: work_insights
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work_insights -d work_insights"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "55432:5432"
    volumes:
      - work_insights_pg:/var/lib/postgresql/data

  dystil-api:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8089:8089"
    restart: unless-stopped

volumes:
  work_insights_pg:
