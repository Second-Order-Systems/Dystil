# Linux production deployment using a prebuilt application image and a
# self-hosted Postgres container. Copy .env.vm.example to a protected host file
# and set ENV_FILE to its path when it is not named .env.vm.
#
# The dystil-api image bundles both the ingest API (Rust) and the auth
# sidecar (Bun) into a single container.

x-production-service: &production-service
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "${LOG_MAX_SIZE:-20m}"
      max-file: "${LOG_MAX_FILES:-5}"

services:
  postgres:
    <<: *production-service
    image: postgres:16.14-alpine
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    env_file:
      - "${ENV_FILE:-.env.vm}"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-1g}"
    cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
    pids_limit: 200
    shm_size: "${POSTGRES_SHM_SIZE:-256m}"
    stop_grace_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      app:
        aliases:
          - prod-postgres

  dystil-api:
    <<: *production-service
    image: "${CONTAINER_REGISTRY:?Set CONTAINER_REGISTRY to the production registry}/dystil-api:prod"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - "${ENV_FILE:-.env.vm}"
    ports:
      - "${INGEST_BIND_ADDRESS:-127.0.0.1}:${INGEST_PORT:-8089}:8089"
    mem_limit: "${INGEST_MEMORY_LIMIT:-1g}"
    cpus: "${INGEST_CPU_LIMIT:-1.0}"
    pids_limit: 300
    stop_grace_period: 30s
    networks:
      - app

  watchtower:
    image: containrrr/watchtower:1.7.1
    profiles:
      - watchtower
    restart: unless-stopped
    command:
      - --label-enable
      - --cleanup
      - --interval
      - "${WATCHTOWER_POLL_INTERVAL:-300}"
    environment:
      WATCHTOWER_ROLLING_RESTART: "true"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILES:-5}"

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
