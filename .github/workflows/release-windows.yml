name: Release Windows App

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version override for src-tauri/Cargo.toml (optional)
        required: false
      validation_only:
        description: Build and validate caches without uploading the release to R2
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: release-windows-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

env:
  APP_DIR: apps/dystil
  APP_SRC_TAURI_DIR: apps/dystil/src-tauri
  # Keep both Rust workspaces in one short, cacheable directory. This avoids
  # Windows path-length failures without deleting a restored target directory.
  CARGO_TARGET_DIR: C:\t
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_PROFILE_RELEASE_PANIC: abort
  CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
  GGML_NATIVE: "OFF"
  GGML_AVX512: "OFF"
  GGML_AVX512_VBMI: "OFF"
  GGML_AVX512_VNNI: "OFF"
  GGML_AVX512_BF16: "OFF"
  CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF -DCMAKE_C_FLAGS=/arch:AVX2 -DCMAKE_CXX_FLAGS=/arch:AVX2

jobs:
  check_commit:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | head -1 | grep -qE "^(Bump app|release-app)"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  publish-windows:
    needs: [check_commit]
    if: github.event_name == 'workflow_dispatch' || needs.check_commit.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Update version in Cargo.toml
        if: github.event.inputs.version != ''
        shell: bash
        run: |
          perl -0pi -e 's/^version = ".*"$/version = "${{ github.event.inputs.version }}"/m' "${{ env.APP_SRC_TAURI_DIR }}/Cargo.toml"
      - name: Compute release version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' "${{ env.APP_SRC_TAURI_DIR }}/Cargo.toml" | sed 's/version = "\(.*\)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        # Match rust-toolchain.toml. Installing floating stable as well caused
        # every stable update to invalidate a build that actually uses 1.93.1.
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            apps/dystil/node_modules
            apps/dystil/.tauri
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/dystil/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Next.js build output
        uses: actions/cache@v4
        with:
          path: apps/dystil/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('apps/dystil/bun.lock') }}-${{ hashFiles('apps/dystil/app/**', 'apps/dystil/components/**', 'apps/dystil/lib/**', 'apps/dystil/config/**', 'apps/dystil/public/**', 'apps/dystil/ready-to-use/**', 'apps/dystil/next.config.mjs', 'apps/dystil/postcss.config.mjs', 'apps/dystil/tailwind.config.ts', 'apps/dystil/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('apps/dystil/bun.lock') }}-

      - name: Enable Git long paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Create short Cargo target dir
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR | Out-Null

      - name: Install frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: bun install

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Select MSVC linker
        shell: powershell
        run: |
          $linker = Get-Command link.exe -All |
            Where-Object { $_.Source -like "*Microsoft Visual Studio*" } |
            Select-Object -First 1 -ExpandProperty Source
          if (-not $linker) {
            throw "Visual Studio link.exe was not found after MSVC setup"
          }
          Write-Host "Using MSVC linker: $linker"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # C:\t is shared by the root MCP workspace and the nested Tauri
          # workspace. Cache it directly instead of restoring through a
          # junction that the old workflow immediately deleted.
          cache-targets: false
          cache-directories: C:\t
          # rust-cache already hashes Cargo manifests, lockfiles, toolchains,
          # Cargo config, and the CARGO/CMAKE environment above.
          key: windows-unified-target-v1

      - name: Download ONNX Runtime
        shell: powershell
        run: |
          $version = '1.24.2'
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-win-x64-$version.zip"
          $zipFile = "onnxruntime-win-x64-$version.zip"
          $extractDir = "apps/dystil/src-tauri/onnxruntime-win-x64-$version"
          Invoke-WebRequest -Uri $url -OutFile $zipFile
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          7z x $zipFile -o"apps/dystil/src-tauri/" -y
          Get-ChildItem "$extractDir/lib" | ForEach-Object { Write-Host $_.Name }

      - name: Use production config for release
        shell: bash
        run: cp "${{ env.APP_SRC_TAURI_DIR }}/tauri.prod.conf.json" "${{ env.APP_SRC_TAURI_DIR }}/tauri.conf.json"

      - name: Build Windows
        working-directory: ${{ env.APP_DIR }}
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          OPENBLAS_PATH: ${{ github.workspace }}\apps\dystil\src-tauri\openblas
          DYSTIL_RELEASE_TARGET: x86_64-pc-windows-msvc
          DYSTIL_AUTH_MODE: individual
          DYSTIL_CLOUD_BASE_URL: https://coconut.2os.ai
        run: bunx tauri build --verbose --target x86_64-pc-windows-msvc --features enterprise-client

      - name: Stage release bundles
        shell: powershell
        env:
          AUTH_MODE: individual
        run: |
          $bundleDir = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc/release/bundle"
          $stagingDir = "release-staging/$env:AUTH_MODE"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          Get-ChildItem -Path $bundleDir -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.zip', '.sig') } |
            ForEach-Object {
              $destinationName = "$($_.BaseName)-$env:AUTH_MODE$($_.Extension)"
              Copy-Item $_.FullName (Join-Path $stagingDir $destinationName)
            }

      - name: Upload release bundle to R2
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_only != true }}
        shell: powershell
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          aws --version

          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $source = "release-staging/individual"
          $destination = "s3://$env:R2_BUCKET/releases/v$env:RELEASE_VERSION/windows/individual/"

          if (-not (Test-Path $source)) {
            throw "Release staging directory does not exist: $source"
          }

          $files = Get-ChildItem -Path $source -Recurse -File
          if ($files.Count -eq 0) {
            throw "No release files found in: $source"
          }

          Write-Host "Uploading $($files.Count) files to $destination"

          aws s3 cp `
            $source `
            $destination `
            --recursive `
            --endpoint-url $endpoint `
            --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "R2 upload failed with exit code $LASTEXITCODE"
          }

          Write-Host "Uploaded release to R2 successfully"
