name: Release Windows App

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version override for src-tauri/Cargo.toml (optional)
        required: false
  push:
    branches: [main]

concurrency:
  group: release-windows-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

env:
  APP_DIR: apps/dystil
  APP_SRC_TAURI_DIR: apps/dystil/src-tauri

jobs:
  check_commit:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | head -1 | grep -qE "^(Bump app|release-app)"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  publish-windows:
    needs: [check_commit]
    if: github.event_name == 'workflow_dispatch' || needs.check_commit.outputs.should_release == 'true'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Update version in Cargo.toml
        if: github.event.inputs.version != ''
        shell: bash
        run: |
          perl -0pi -e 's/^version = ".*"$/version = "${{ github.event.inputs.version }}"/m' "${{ env.APP_SRC_TAURI_DIR }}/Cargo.toml"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-${{ hashFiles('**/Cargo.lock') }}
          cache-directories: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/dystil/src-tauri/target

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            apps/dystil/node_modules
            apps/dystil/.tauri
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/dystil/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Enable Git long paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Shorten target dir
        shell: powershell
        run: |
          $targetDir = "apps\dystil\src-tauri\target"
          $shortDir = "C:\t"
          if (Test-Path $shortDir) { Remove-Item -Recurse -Force $shortDir }
          New-Item -ItemType Directory -Force -Path $shortDir | Out-Null
          if (Test-Path $targetDir) { Remove-Item -Recurse -Force $targetDir }
          cmd /c mklink /J $targetDir $shortDir

      - name: Install frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: bun install

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download ONNX Runtime
        shell: powershell
        run: |
          $version = '1.24.2'
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-win-x64-$version.zip"
          $zipFile = "onnxruntime-win-x64-$version.zip"
          $extractDir = "apps/dystil/src-tauri/onnxruntime-win-x64-$version"
          Invoke-WebRequest -Uri $url -OutFile $zipFile
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          7z x $zipFile -o"apps/dystil/src-tauri/" -y
          Get-ChildItem "$extractDir/lib" | ForEach-Object { Write-Host $_.Name }

      - name: Run pre_build.js
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          DYSTIL_RELEASE_TARGET: x86_64-pc-windows-msvc
        run: bun ./scripts/pre_build.js

      - name: Use production config for release
        shell: bash
        run: cp "${{ env.APP_SRC_TAURI_DIR }}/tauri.prod.conf.json" "${{ env.APP_SRC_TAURI_DIR }}/tauri.conf.json"

      - name: Build Windows
        working-directory: ${{ env.APP_DIR }}
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_INCREMENTAL: "true"
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_PANIC: abort
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          GGML_NATIVE: "OFF"
          GGML_AVX512: "OFF"
          GGML_AVX512_VBMI: "OFF"
          GGML_AVX512_VNNI: "OFF"
          GGML_AVX512_BF16: "OFF"
          CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF -DCMAKE_C_FLAGS=/arch:AVX2 -DCMAKE_CXX_FLAGS=/arch:AVX2
          OPENBLAS_PATH: ${{ github.workspace }}\apps\dystil\src-tauri\openblas
          DYSTIL_AUTH_MODE: individual
        run: bunx tauri build --verbose --target x86_64-pc-windows-msvc --features official-build,redact-onnx-directml

      - name: Stage release bundles
        shell: powershell
        env:
          AUTH_MODE: individual
        run: |
          $bundleDir = "apps/dystil/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $stagingDir = "release-staging/$env:AUTH_MODE"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          Get-ChildItem -Path $bundleDir -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.zip', '.sig') } |
            ForEach-Object {
              $destinationName = "$($_.BaseName)-$env:AUTH_MODE$($_.Extension)"
              Copy-Item $_.FullName (Join-Path $stagingDir $destinationName)
            }

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-individual
          if-no-files-found: error
          path: release-staging/individual

  publish-release:
    needs: [check_commit, publish-windows]
    if: github.event_name == 'workflow_dispatch' || needs.check_commit.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update version in Cargo.toml
        if: github.event.inputs.version != ''
        shell: bash
        run: |
          perl -0pi -e 's/^version = ".*"$/version = "${{ github.event.inputs.version }}"/m' "${{ env.APP_SRC_TAURI_DIR }}/Cargo.toml"

      - name: Compute release version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' "${{ env.APP_SRC_TAURI_DIR }}/Cargo.toml" | sed 's/version = "\(.*\)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dystil ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.zip
            release-artifacts/**/*.sig
