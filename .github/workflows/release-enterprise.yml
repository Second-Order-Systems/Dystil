name: Release Enterprise App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and publish
        required: true
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    with:
      publish_mode: enterprise
      cargo_features: enterprise-client,windows-store
      cloud_base_url: https://coconut.2os.ai
      telemetry_endpoint: https://coconut.2os.ai/v1/telemetry
      artifact_edition: enterprise
      platform: ${{ inputs.platform }}
    secrets: inherit
