[workspace]

[package]
name = "dystil-app"
version = "0.0.9"
description = "Dystil your work."
authors = ["jayhsiai"]
license = ""
repository = ""
default-run = "dystil-app"
edition = "2021"
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }
tauri-helper = { git = "https://github.com/divanshu-go/tauri-helper", rev = "e25ff1d2c5026189305a0251a1e06788efe1d2b3" }
serde_json = "1.0"
serde_yaml = "0.9"
url = "2"
# Used by build.rs on Windows MSVC targets (incl. cross-compiles from
# Linux/macOS CI runners) to compile c/bswap_shim.c — provides
# __builtin_bswap{16,32,64} as real functions to satisfy the aws-lc-sys
# link. Unconditional because target-gated build-deps key off the build
# *host*, not the target, which excludes cc on cross-compiles.
cc = "1"

[dependencies]
tauri-helper = { git = "https://github.com/divanshu-go/tauri-helper", rev = "e25ff1d2c5026189305a0251a1e06788efe1d2b3" }
tauri = { version = "=2.11.2", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  "devtools",
  "image-png",
  "image-ico",
  # Embedded child webview (the agent-controlled browser sidebar) requires
  # WindowBuilder::add_child, which is currently behind the unstable feature.
  "unstable",
] }
tauri-utils = { version = "=2.9.2", features = [] }
# plugins
tauri-plugin-fs = "=2.4.5"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-os = "=2.3.2"
tauri-plugin-process = "=2.3.1"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-store = "=2.4.2"
# Keep the plugin's existing defaults, but trust roots managed by the host OS
# (Windows certificate store, macOS Keychain, Linux CA bundle) rather than
# only the bundled web-PKI roots. This supports enterprise TLS inspection
# without weakening certificate verification.
tauri-plugin-http = { version = "=2.5.7", default-features = false, features = ["rustls-tls-native-roots", "http2", "charset", "macos-system-configuration", "cookies"] }
# tauri-plugin-http 2.5.7 does not expose Reqwest's `system-proxy` feature.
# Cargo unifies features for the pinned Reqwest 0.12 package below, enabling
# Windows/macOS system proxy and PAC support for the plugin's native fetches.
tauri-plugin-http-system-proxy = { package = "reqwest", version = "=0.12.28", default-features = false, features = ["system-proxy"] }
tauri-plugin-permission-flow = { git = "https://github.com/divanshu-go/permission-flow", rev = "38a64e3704aa32e692bab95cffe704859e191a51", package = "tauri-plugin-permission-flow" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
plist = "1"
arc-swap = "1"

tower-http = { version = "0.4.0", features = ["cors", "trace"] }
http = "0.2"

# TypeScript bindings
specta = { version = "=2.0.0-rc.20", features = [
	"derive",
	"serde_json",
	"uuid",
] }
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }
specta-typescript = "0.0.7"

# Logging
log = "0.4.17"

# Dark mode or light mode
dark-light = "2.0.0"

# Tokio
tokio = { version = "1.36.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "form", "rustls", "system-proxy"] }
opentelemetry-proto = { version = "0.32.0", features = ["gen-tonic-messages", "metrics", "trace"] }
prost = "0.14"

# tracing
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-appender = "0.2.3"


sha2 = "0.10"
hex = "0.4"
anyhow = "1.0.71"
arboard = "3.4"

# System information
sysinfo = "=0.29.0"

# hakc
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }

# server
axum = "0.6.0" # or your current version



dirs = "5.0.1"
tauri-plugin-deep-link = "=2.4.6"

once_cell = "1.20.0"
regex = "1"
raw-window-handle = "0.6"

notify = "8.0.0"
futures = "0.3.30"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

chrono = "0.4.39"
cron = "0.15"
tauri-plugin-opener = "2.5.3"
uuid = { version = "1.0", features = ["v4"] }
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "linux-native-sync-persistent",
  "crypto-rust",
] }
zip = "2"
urlencoding = "2"
url = "2"
async-trait = "0.1"
same-file = "1.0"

# Cloud sync utilities
hostname = "0.4"
dystil-engine = { path = "../../../crates/dystil-engine", optional = true }
dystil-sync = { path = "../../../crates/dystil-sync", optional = true }
dystil-storage = { path = "../../../crates/dystil-storage" }
dystil-retrieval = { path = "../../../crates/dystil-retrieval" }
dystil-ai = { path = "../../../crates/dystil-ai" }
dystil-insights = { path = "../../../crates/dystil-insights" }
dystil-protocol = { path = "../../../crates/dystil-protocol" }
dystil-automation = { path = "../../../crates/dystil-automation" }

dystil-capture = { path = "../../../crates/dystil-capture", features = ["native"] }
dystil-telemetry = { path = "../../../crates/dystil-telemetry" }
dystil-redact = { path = "../../../crates/dystil-redact" }
eventkit-rs = { git = "https://github.com/divanshu-go/eventkit-rs", rev = "9dd52787c8435d734ed443e2d5641f45b0177cae", default-features = false, features = ["events"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls"] }
image = "0.25.5"

# jemalloc — aggressively returns freed pages to OS, reducing RSS bloat
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-cli = "2.4.1"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.3.7", features = ["deep-link"] }
tauri-plugin-updater = { version = "=2.10.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog = "0.3.0"
core-foundation = "0.10"
cocoa = "0.26.0"
objc = "0.2.7"
block = "0.1"
base64 = "0.22.1"
# Fix macOS 26 Tahoe crash: ObjC method signatures changed from signed to unsigned
# integers, causing objc2 strict validation to panic inside tao's extern "C" callbacks
# (send_event, did_finish_launching) → panic_cannot_unwind → SIGABRT
# See: https://github.com/tauri-apps/tao/issues/1171
objc2 = { version = "0.6", features = ["relax-sign-encoding"] }
# bunch of hack for permissions
core-graphics-helmer-fork = "0.24.0"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }
# Owned-browser cookie inheritance (see src/owned_browser_cookies.rs):
# read Arc/Chrome's `Cookies` SQLite, pull the AES-128 key from the
# macOS Keychain (`Arc Safe Storage`), AES-CBC decrypt each
# `encrypted_value`, then inject via `WKHTTPCookieStore.setCookie` so
# the agent's webview ships with the user's logged-in sessions instead
# of an empty cookie jar.
rusqlite = { version = "0.29.0", features = ["bundled"] }
security-framework = "3.7.0"
aes = "0.8.4"
cbc = "0.1.2"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
sha1 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52.0"
lazy_static = "1.5.0"
image = "0.25.5"
windows-icons = { git = "https://github.com/tribhuwan-kumar/windows-icons.git", rev = "4dcd086b36bed286181cb87636ad6eb058ab7684" }
base64 = "0.22.1"
aes-gcm = "0.10"
rusqlite = { version = "0.29.0", features = ["bundled"] }
raw-window-handle = "0.6"
webview2-com = "=0.38.2"
windows-core = "0.61.2"
windows = { version = "0.58", features = [
    "ApplicationModel",
    "Foundation_Collections",
    "Services_Store",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Recovery",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.1"
base64 = "0.22.1"
freedesktop-desktop-entry = "0.7.0"
freedesktop-icon-lookup = "0.1.3"
xdg = "2.5.2"
ini = "1.3"
resvg = "0.45.1"
image = "0.25.5"
futures-channel = "0.3.30"
lazy_static = "1.5.0"

[features]
default = ["custom-protocol", "onnx-cpu"]
cargo-clippy = []

# Cloud code is absent from normal source/community builds. Individual auth is
# the default cloud mode; workspace auth is an explicit, additive build flavor.
cloud-sync = ["dep:dystil-engine", "dep:dystil-sync"]
workspace-auth = ["cloud-sync"]
# Managed client distribution. This is a policy flavor, not just a collection
# of optional capabilities: capture and both sync channels are compile-time on.
enterprise-client = ["cloud-sync", "official-build"]

# Keep the application cfg in sync with the dependency features. Without this
# declaration `#[cfg(feature = "onnx-cpu")]` in capture_session.rs is compiled
# out even though the Dystil crates themselves include ONNX support.
onnx-cpu = ["dystil-capture/onnx-cpu", "dystil-redact/onnx-cpu"]

# macOS build flavor override. The default macOS build uses short-lived
# on-demand SCStream capture. Enable this feature to build the legacy
# continuously-running VisionManager capture pipeline instead. This feature is
# intentionally compile-time only: it is not a user setting or runtime switch.

# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Set by GitHub Actions release workflow. Cloud access remains independent.
official-build = ["dep:tauri-plugin-updater"]

# Microsoft Store/MSIX distribution for Windows. Store builds use
# Windows.Services.Store rather than the Tauri/R2 updater, while retaining
# the rest of the official build capabilities.
windows-store = []

jemalloc = ["tikv-jemallocator"]


[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
serial_test = "3"


[package.metadata.cargo-machete]
# eventkit-rs: lib crate is imported as `eventkit` (calendar.rs, permissions.rs);
# cargo-machete matches the package name `eventkit_rs` so it can't see the use.
ignored = ["tauri-utils", "eventkit-rs"]

[patch.crates-io]
# macOS tray menus can outlive the Rust `Menu` that created them while the
# native menu is open. This fork stores an Rc<MenuChild> on NSMenuItem instead
# of a raw pointer so stale AppKit items keep their Rust click data alive.
# Pinned by commit (not branch) for reproducible builds; drop once
# upstream tauri-apps/muda#361 merges and ships in a released muda.
muda = { git = "https://github.com/divanshu-go/muda", rev = "9dc5de53e84040a63c9a5423b669ec892de8a671" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Fast local release builds: cargo build --profile release-dev
[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

# Maximum-speed local builds for the updater harness — no optimization, fastest compile.
# Trades runtime perf and binary size for compile speed.
[profile.release-local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 1
debug = false

# Faster dev builds
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
